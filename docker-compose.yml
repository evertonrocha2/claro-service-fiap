services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sync
      MYSQL_DATABASE: sync
    ports:
      - '3307:3306'
    volumes:
      - sync-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-psync']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sync-mysql:
